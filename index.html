<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f0e8" />
  <title>Sandbox Processing</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --bg:#f4f0e8;
      --card:#fffdf8;
      --ink:#252421;
      --muted:#6f6c65;
      --line:#d9d2c7;
      --accent:#404a43;
      --danger:#8d3b32;
      --soft:#ebe5da;
      --radius:18px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      min-height:100vh;
    }
    .wrap{
      max-width:760px;
      margin:0 auto;
      padding:22px 18px 60px;
    }
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:14px;
      margin-bottom:18px;
    }
    h1{
      margin:0;
      font-size:30px;
      letter-spacing:-.03em;
      font-weight:700;
    }
    .sub{
      margin:5px 0 0;
      color:var(--muted);
      font-size:14px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:0 2px 12px rgba(0,0,0,.035);
      margin-bottom:16px;
    }
    label{
      display:block;
      font-size:14px;
      font-weight:650;
      margin-bottom:7px;
    }
    input, select, textarea, button{
      font:inherit;
    }
    input[type="text"], input[type="number"], select, textarea{
      width:100%;
      background:#fff;
      color:var(--ink);
      border:1px solid var(--line);
      border-radius:13px;
      padding:13px 14px;
      font-size:17px;
      outline:none;
    }
    input:focus, select:focus, textarea:focus{
      border-color:#8b928c;
      box-shadow:0 0 0 3px rgba(64,74,67,.10);
    }
    textarea{min-height:88px;resize:vertical}
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .field{margin-bottom:15px}
    .field:last-child{margin-bottom:0}
    .hidden{display:none!important}
    .type-buttons{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
    }
    .type-btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:13px;
      padding:13px 8px;
      color:var(--ink);
      font-weight:650;
    }
    .type-btn.active{
      background:var(--accent);
      color:white;
      border-color:var(--accent);
    }
    .photo-zone{
      border:1.5px dashed #b9b1a5;
      border-radius:15px;
      padding:12px;
      text-align:center;
      background:#fff;
    }
    .photo-actions{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .native-file{
      position:relative;
      overflow:hidden;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:150px;
      min-height:44px;
      padding:11px 15px;
      border-radius:12px;
      background:var(--soft);
      font-weight:650;
      cursor:pointer;
    }
    .native-file input{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      opacity:0;
      cursor:pointer;
      font-size:100px;
    }
    #preview{
      max-width:100%;
      max-height:310px;
      border-radius:12px;
      margin-top:12px;
      display:none;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    button.primary, button.secondary, button.danger{
      border:0;
      border-radius:13px;
      padding:13px 16px;
      font-weight:700;
      cursor:pointer;
    }
    button.primary{
      background:var(--accent);
      color:white;
      flex:1;
      min-width:180px;
    }
    button.secondary{
      background:var(--soft);
      color:var(--ink);
    }
    button.danger{
      background:#f4e2df;
      color:var(--danger);
    }
    .notice{
      font-size:14px;
      color:var(--muted);
      margin-top:10px;
      min-height:20px;
    }
    .recent-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }
    .recent-head h2{font-size:20px;margin:0}
    .item{
      display:grid;
      grid-template-columns:58px 1fr auto;
      gap:12px;
      align-items:center;
      padding:10px 0;
      border-top:1px solid var(--line);
    }
    .item:first-child{border-top:0}
    .thumb{
      width:58px;height:58px;border-radius:10px;
      object-fit:cover;background:var(--soft);
    }
    .item-id{font-weight:750;font-size:17px}
    .meta{font-size:13px;color:var(--muted);margin-top:2px}
    .mini{
      border:1px solid var(--line);
      background:#fff;
      border-radius:10px;
      padding:8px 10px;
      font-weight:650;
    }
    .empty{color:var(--muted);font-size:14px;padding:10px 0}
    .footer-note{
      font-size:12px;color:var(--muted);line-height:1.4;margin-top:12px
    }
    @media(max-width:560px){
      .grid{grid-template-columns:1fr}
      h1{font-size:27px}
      .wrap{padding-left:14px;padding-right:14px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sandbox Processing</h1>
      <div class="sub">Fast garment intake: identify, photograph, measure, note, save.</div>
    </div>
  </header>

  <form id="itemForm" class="card">
    <input type="hidden" id="editingId" />

    <div class="field">
      <label>Garment type</label>
      <div class="type-buttons">
        <button type="button" class="type-btn" data-type="Sweater">Sweater</button>
        <button type="button" class="type-btn" data-type="Scarf">Scarf</button>
        <button type="button" class="type-btn" data-type="Other">Other</button>
      </div>
      <input type="hidden" id="garmentType" required />
    </div>

    <div class="field">
      <label for="itemId">Item ID</label>
      <input id="itemId" type="text" autocomplete="off" autocapitalize="characters"
             placeholder="e.g. B127" required />
    </div>

    <div class="field">
      <label>Quick photo</label>
      <div class="photo-zone">
        <div class="photo-actions">
          <div class="native-file">
            Take photo
            <input id="photoInput" type="file" accept="image/*" capture="environment" aria-label="Take photo" />
          </div>
          <div class="native-file">
            Choose photo
            <input id="photoLibraryInput" type="file" accept="image/*" aria-label="Choose photo" />
          </div>
        </div>
        <img id="preview" alt="Item preview" />
      </div>
    </div>

    <div id="sweaterFields" class="hidden">
      <div class="grid">
        <div class="field">
          <label for="p2p">P2P (cm)</label>
          <input id="p2p" type="number" inputmode="decimal" step="0.1" min="0" />
        </div>
        <div class="field">
          <label for="sweaterLength">Length (cm)</label>
          <input id="sweaterLength" type="number" inputmode="decimal" step="0.1" min="0" />
        </div>
        <div class="field">
          <label for="shoulders">Shoulders (cm)</label>
          <input id="shoulders" type="number" inputmode="decimal" step="0.1" min="0" />
        </div>
        <div class="field">
          <label for="sleeve">Sleeve length (cm)</label>
          <input id="sleeve" type="number" inputmode="decimal" step="0.1" min="0" />
        </div>
      </div>
    </div>

    <div id="scarfFields" class="hidden">
      <div class="grid">
        <div class="field">
          <label for="scarfLength">Length (cm)</label>
          <input id="scarfLength" type="number" inputmode="decimal" step="0.1" min="0" />
        </div>
        <div class="field">
          <label for="width">Width (cm)</label>
          <input id="width" type="number" inputmode="decimal" step="0.1" min="0" />
        </div>
      </div>
    </div>

    <div id="otherFields" class="hidden">
      <div class="field">
        <label for="notes">Notes / measurements</label>
        <textarea id="notes" placeholder="Record any relevant measurements or details"></textarea>
      </div>
    </div>

    <div class="field">
      <label for="defects">Known defects</label>
      <textarea id="defects" placeholder="e.g. tiny repaired hole near hem; light pilling"></textarea>
    </div>

    <div class="field">
      <label for="strengths">Strengths</label>
      <textarea id="strengths" placeholder="e.g. dense cashmere; excellent colour; strong large size"></textarea>
    </div>

    <div class="actions">
      <button type="submit" class="primary">Save item</button>
      <button type="button" id="resetBtn" class="secondary">Clear</button>
    </div>
    <div id="notice" class="notice"></div>
  </form>

  <section class="card">
    <div class="recent-head">
      <h2>Recent items</h2>
      <button id="exportBtn" type="button" class="secondary">Export CSV</button>
    </div>
    <div id="recent"></div>
    <div class="footer-note">
      Records and compressed quick photos are stored on this device in the browser.
      CSV export contains the structured fields, not the image files.
    </div>
  </section>
</div>

<script>
const DB_NAME = "sandboxProcessingDB";
const DB_VERSION = 1;
const STORE = "items";
let db;
let currentPhoto = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        const s = d.createObjectStore(STORE,{keyPath:"id"});
        s.createIndex("updatedAt","updatedAt");
      }
    };
    req.onsuccess=e=>{db=e.target.result;resolve(db)};
    req.onerror=e=>reject(e.target.error);
  });
}
function tx(mode="readonly"){ return db.transaction(STORE,mode).objectStore(STORE); }

function allItems(){
  return new Promise((resolve,reject)=>{
    const req = tx().getAll();
    req.onsuccess=()=>resolve(req.result.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)));
    req.onerror=()=>reject(req.error);
  });
}
function getItem(id){
  return new Promise((resolve,reject)=>{
    const req=tx().get(id);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function putItem(item){
  return new Promise((resolve,reject)=>{
    const req=tx("readwrite").put(item);
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}
function deleteItem(id){
  return new Promise((resolve,reject)=>{
    const req=tx("readwrite").delete(id);
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}

function selectType(type){
  document.getElementById("garmentType").value = type;
  document.querySelectorAll(".type-btn").forEach(b=>b.classList.toggle("active",b.dataset.type===type));
  document.getElementById("sweaterFields").classList.toggle("hidden",type!=="Sweater");
  document.getElementById("scarfFields").classList.toggle("hidden",type!=="Scarf");
  document.getElementById("otherFields").classList.toggle("hidden",type!=="Other");
}
document.querySelectorAll(".type-btn").forEach(b=>b.addEventListener("click",()=>selectType(b.dataset.type)));

async function compressImage(file){
  if(!file) return null;
  const img = new Image();
  const dataUrl = await new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=reject;
    fr.readAsDataURL(file);
  });
  await new Promise((resolve,reject)=>{
    img.onload=resolve; img.onerror=reject; img.src=dataUrl;
  });
  const max=1200;
  let w=img.width,h=img.height;
  if(Math.max(w,h)>max){
    const scale=max/Math.max(w,h);
    w=Math.round(w*scale); h=Math.round(h*scale);
  }
  const c=document.createElement("canvas");
  c.width=w;c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return c.toDataURL("image/jpeg",0.76);
}
async function handlePhotoFile(file){
  if(!file) return;
  currentPhoto=await compressImage(file);
  const p=document.getElementById("preview");
  p.src=currentPhoto;
  p.style.display="inline-block";
}
document.getElementById("photoInput").addEventListener("change", e=>{
  handlePhotoFile(e.target.files && e.target.files[0]);
});
document.getElementById("photoLibraryInput").addEventListener("change", e=>{
  handlePhotoFile(e.target.files && e.target.files[0]);
});

function val(id){
  const v=document.getElementById(id).value.trim();
  return v==="" ? "" : v;
}
function num(id){
  const v=document.getElementById(id).value;
  return v==="" ? "" : Number(v);
}
function clearForm(){
  document.getElementById("itemForm").reset();
  document.getElementById("editingId").value="";
  document.getElementById("garmentType").value="";
  document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("sweaterFields").classList.add("hidden");
  document.getElementById("scarfFields").classList.add("hidden");
  document.getElementById("otherFields").classList.add("hidden");
  currentPhoto=null;
  document.getElementById("photoInput").value="";
  document.getElementById("photoLibraryInput").value="";
  const p=document.getElementById("preview");p.src="";p.style.display="none";
  document.getElementById("notice").textContent="";
  document.querySelector('button[type="submit"]').textContent="Save item";
}
document.getElementById("resetBtn").addEventListener("click",clearForm);

document.getElementById("itemForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const type=val("garmentType");
  const id=val("itemId").toUpperCase();
  const editingOriginal=val("editingId");
  const notice=document.getElementById("notice");
  if(!type){notice.textContent="Choose Sweater, Scarf or Other.";return;}
  if(!id){notice.textContent="Enter an item ID.";return;}

  const existing=await getItem(id);
  if(existing && editingOriginal!==id){
    notice.textContent=`${id} already exists. Open it from Recent items to edit it.`;
    return;
  }

  if(editingOriginal && editingOriginal!==id){
    await deleteItem(editingOriginal);
  }

  const old = existing || (editingOriginal ? await getItem(editingOriginal) : null);
  const item={
    id,
    type,
    photo: currentPhoto || old?.photo || null,
    p2p: type==="Sweater" ? num("p2p") : "",
    length: type==="Sweater" ? num("sweaterLength") : type==="Scarf" ? num("scarfLength") : "",
    shoulders: type==="Sweater" ? num("shoulders") : "",
    sleeve: type==="Sweater" ? num("sleeve") : "",
    width: type==="Scarf" ? num("width") : "",
    notes: type==="Other" ? val("notes") : "",
    defects: val("defects"),
    strengths: val("strengths"),
    createdAt: old?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  await putItem(item);
  notice.textContent=`Saved ${id}.`;
  await renderRecent();
  setTimeout(clearForm,650);
});

function measurementSummary(x){
  if(x.type==="Sweater"){
    const bits=[];
    if(x.p2p!=="") bits.push(`P2P ${x.p2p}`);
    if(x.length!=="") bits.push(`L ${x.length}`);
    if(x.shoulders!=="") bits.push(`Sh ${x.shoulders}`);
    if(x.sleeve!=="") bits.push(`Sl ${x.sleeve}`);
    return bits.join(" · ");
  }
  if(x.type==="Scarf"){
    const bits=[];
    if(x.length!=="") bits.push(`L ${x.length}`);
    if(x.width!=="") bits.push(`W ${x.width}`);
    return bits.join(" · ");
  }
  if(x.type==="Other"){
    return x.notes || "";
  }
  return "";
}
async function renderRecent(){
  const list=await allItems();
  const box=document.getElementById("recent");
  box.innerHTML="";
  if(!list.length){
    box.innerHTML='<div class="empty">No processed items yet.</div>';
    return;
  }
  list.slice(0,20).forEach(x=>{
    const row=document.createElement("div");row.className="item";
    const img=document.createElement("img");img.className="thumb";
    if(x.photo) img.src=x.photo;
    const middle=document.createElement("div");
    middle.innerHTML=`<div class="item-id">${escapeHtml(x.id)} · ${escapeHtml(x.type)}</div>
      <div class="meta">${escapeHtml(measurementSummary(x) || "No measurements")}</div>`;
    const btn=document.createElement("button");btn.className="mini";btn.type="button";btn.textContent="Open";
    btn.addEventListener("click",()=>loadForEdit(x.id));
    row.append(img,middle,btn);box.append(row);
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
async function loadForEdit(id){
  const x=await getItem(id); if(!x)return;
  clearForm();
  document.getElementById("editingId").value=x.id;
  document.getElementById("itemId").value=x.id;
  selectType(x.type);
  if(x.type==="Sweater"){
    document.getElementById("p2p").value=x.p2p;
    document.getElementById("sweaterLength").value=x.length;
    document.getElementById("shoulders").value=x.shoulders;
    document.getElementById("sleeve").value=x.sleeve;
  }else if(x.type==="Scarf"){
    document.getElementById("scarfLength").value=x.length;
    document.getElementById("width").value=x.width;
  }else if(x.type==="Other"){
    document.getElementById("notes").value=x.notes||"";
  }
  document.getElementById("defects").value=x.defects||"";
  document.getElementById("strengths").value=x.strengths||"";
  currentPhoto=x.photo||null;
  if(currentPhoto){
    const p=document.getElementById("preview");
    p.src=currentPhoto;p.style.display="inline-block";
  }
  document.querySelector('button[type="submit"]').textContent="Update item";
  document.getElementById("notice").textContent=`Editing ${x.id}.`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function csvEscape(v){
  const s = v==null ? "" : String(v);
  return `"${s.replaceAll('"','""')}"`;
}
document.getElementById("exportBtn").addEventListener("click", async ()=>{
  const list=await allItems();
  const headers=["ID","Type","P2P_cm","Length_cm","Shoulders_cm","Sleeve_cm","Width_cm","Notes","Defects","Strengths","Created","Updated"];
  const rows=[headers.map(csvEscape).join(",")];
  list.forEach(x=>{
    rows.push([
      x.id,x.type,x.p2p,x.length,x.shoulders,x.sleeve,x.width,x.notes,x.defects,x.strengths,x.createdAt,x.updatedAt
    ].map(csvEscape).join(","));
  });
  const blob=new Blob([rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`sandbox_processing_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
openDB().then(renderRecent);
</script>
</body>
</html>
